name: little_check
description: A quiet feed reader and local Markdown notebook.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  cached_network_image: ^4.0.4
  flutter_cache_manager: ^3.4.5
  flutter_secure_storage: ^11.2.0
  basic_utils: ^5.8.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file: ^7.0.1
flutter:
  uses-material-design: true
  assets:
    - server/example-feed.json
    - assets/ai/
